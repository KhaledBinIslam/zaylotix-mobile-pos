plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

// Same external keystore the main TWA app uses (android/app/build.gradle's
// exact pattern): lives entirely outside the repo at
// D:\zaylotix-keystore-backup, passwords loaded from its own
// keystore.properties at build time so nothing secret is ever tracked.
// One publisher, one keystore, two apps — standard practice.
def keystorePropsFile = new File("D:/zaylotix-keystore-backup/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.zaylotix.printerhelper"
    compileSdk 36

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile new File(keystorePropsFile.parentFile, keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.zaylotix.printerhelper"
        // 26 (Android 8) — modern enough to keep BLE/runtime-permission
        // handling simple, old enough to cover real low-cost shop phones.
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}
