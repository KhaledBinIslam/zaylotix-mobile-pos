plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace "com.zaylotix.printerhelper"
    compileSdk 36

    defaultConfig {
        applicationId "com.zaylotix.printerhelper"
        // 26 (Android 8) — modern enough to keep BLE/runtime-permission
        // handling simple, old enough to cover real low-cost shop phones.
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    // Debug-signed only for now (docs/BT_PRINT_PLAN.md step-by-step: prove
    // the whole pipeline live first). Release signing added once Khaled
    // confirms the debug build actually prints correctly on the real
    // XP-365B — see PRINTER_HELPER_SETUP.md.
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}
